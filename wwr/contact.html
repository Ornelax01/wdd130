<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Contact White Water Rafting for reservations, general inquiries, or website suggestions. Find our address, phone number, email, and location map here.">
    <meta name="author" content="Carlos Ornelas">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us | White Water Rafting</title>
</head>

<body>
    
<header>
  <img src="images/z-crossedoars.jpeg" alt="Rafting Company Logo">
  <nav>
    <ul class="navigation">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="trips.html">Trips</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

    <main>
        <h1>Contact Us</h1>

        <section class="company-info">
            <h2>Company Information</h2>
            <p><strong>Address:</strong> 701 INTERNATIONAL ROAD, HIDALGO, TEXAS</p>
            <p><strong>Phone:</strong> (956) 843-9457</p>
            <p><strong>Email:</strong> contact@whitewaterrafting.com</p>

            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3582.6478364354384!2d-98.2643230240036!3d26.110412094107076!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x866509204ee23ea3%3A0xd7ebe4f4879591ba!2sWorld%20Wide%20Parcel%20INC!5e0!3m2!1ses-419!2smx!4v1771279690957!5m2!1ses-419!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Sarah Jonson - River Guide">
                <figcaption>Sarah Jonson - Senior River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpeg" alt="Maria Martinez - Reservation Manager">
                <figcaption>Maria Martinez - Reservation Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.avif" alt="Mike Johnson - Safety Instructor">
                <figcaption>Mike Johnson - Safety Instructor</figcaption>
            </figure>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form action="#" method="post">
                
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required>

        <fieldset>
            <legend>Purpose of Message</legend>

            <input type="radio" id="general" name="purpose" value="general" required>
            <label for="general">General Inquiry</label>

            <input type="radio" id="reservation" name="purpose" value="reservation">
            <label for="reservation">Reservation Question</label>

            <input type="radio" id="suggestion" name="purpose" value="suggestion">
            <label for="suggestion">Website Suggestion</label>

        </fieldset>


                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

            <input type="checkbox" id="subscribe" name="subscribe">
                <label for="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>
                <button type="submit">Send My Message</button>
            </form>
        </section>

    </main>

    <footer>
        <p>© 2026 - White Water Rafting - Carlos Ornelas</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram icon">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube-square.svg" alt="YouTube icon">
            </a>
        </nav>
    </footer>

</body>
</html>
